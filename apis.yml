name: Coremetrics
description: Coremetrics was a web analytics software company founded in 1999 and headquartered in
  San Mateo, California. It delivered a cloud-based (SaaS) digital marketing analytics platform used by
  more than 2,100 online brands to capture and analyze visitor and shopper behavior across web, social,
  and mobile channels for marketing optimization, attribution, and personalization. Backed by Accel and
  other venture investors, Coremetrics was acquired by IBM in 2010 and folded into IBM Digital Analytics
  and the IBM Watson Marketing / Enterprise Marketing Management suite. The standalone coremetrics.com
  developer surface is no longer operational, and no live public API, documentation, or SDK could be
  found during enrichment.
